services:
  - type: worker
    name: full7-mass-collector-17685
    runtime: python
    plan: starter
    region: frankfurt
    branch: collector/full7-mass-17685
    autoDeployTrigger: off
    buildCommand: pip install -r collector/full7_mass_worker/requirements.txt
    startCommand: >-
      mkdir -p /var/data/full7/input /var/data/full7/output &&
      python -u collector/full7_mass_worker/bootstrap_input.py &&
      python -u collector/full7_mass_worker/collect.py
    maxShutdownDelaySeconds: 300
    numInstances: 1
    envVars:
      - key: FOOTYSTATS_API_KEY
        sync: false
      - key: FULL7_CSV
        value: /var/data/full7/input/backtest_50_ligen.csv
      - key: FULL7_ROOT
        value: /var/data/full7/output
      - key: FULL7_EXPECTED_TOTAL
        value: "17685"
      - key: FULL7_SLEEP
        value: "0.22"
      - key: FULL7_TIMEOUT
        value: "90"
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: full7-mass-data
      mountPath: /var/data
      sizeGB: 10
