name: FULL7 recovery transfer

on:
  push:
    branches:
      - audit/full7-cp2-20260922
    paths:
      - .github/FULL7_RECOVERY_REQUEST.txt

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Remove previous recovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.name | startswith("full7-recovery-")) | .id'             | while read -r id; do
                [ -n "$id" ] && gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" || true
              done

      - name: Download requested encrypted recovery object
        id: download
        run: |
          set -euo pipefail
          REQ="$(head -n1 .github/FULL7_RECOVERY_REQUEST.txt | tr -d '\r\n')"
          case "$REQ" in
            index.json|part-[0-9][0-9][0-9][0-9].tar.enc) ;;
            *) echo "Invalid request: $REQ" >&2; exit 2 ;;
          esac
          URL="https://full7-recovery-proxy-20260923.onrender.com/public/$REQ"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30             --output "$REQ" "$URL"
          SHA="$(sha256sum "$REQ" | awk '{print $1}')"
          BYTES="$(stat -c %s "$REQ")"
          printf '{"file":"%s","bytes":%s,"sha256":"%s"}\n' "$REQ" "$BYTES" "$SHA" > FULL7_TRANSFER_RECEIPT.json
          echo "req=$REQ" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Split large encrypted part for connector-safe transfer
        if: startsWith(steps.download.outputs.req, 'part-')
        run: |
          set -euo pipefail
          REQ="${{ steps.download.outputs.req }}"
          split -b 200000000 -d -a 2 "$REQ" "$REQ.chunk-"
          ls -lh "$REQ".chunk-*
          sha256sum "$REQ".chunk-* > FULL7_CHUNK_SHA256.txt
          stat -c '%n %s' "$REQ".chunk-* > FULL7_CHUNK_SIZES.txt

      - name: Upload chunk 00
        if: startsWith(steps.download.outputs.req, 'part-')
        uses: actions/upload-artifact@v4
        with:
          name: full7-recovery-${{ steps.download.outputs.req }}-chunk-00
          path: |
            ${{ steps.download.outputs.req }}.chunk-00
            FULL7_TRANSFER_RECEIPT.json
            FULL7_CHUNK_SHA256.txt
            FULL7_CHUNK_SIZES.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload chunk 01
        if: startsWith(steps.download.outputs.req, 'part-')
        uses: actions/upload-artifact@v4
        with:
          name: full7-recovery-${{ steps.download.outputs.req }}-chunk-01
          path: |
            ${{ steps.download.outputs.req }}.chunk-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload chunk 02
        if: startsWith(steps.download.outputs.req, 'part-')
        uses: actions/upload-artifact@v4
        with:
          name: full7-recovery-${{ steps.download.outputs.req }}-chunk-02
          path: |
            ${{ steps.download.outputs.req }}.chunk-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload chunk 03
        if: startsWith(steps.download.outputs.req, 'part-')
        uses: actions/upload-artifact@v4
        with:
          name: full7-recovery-${{ steps.download.outputs.req }}-chunk-03
          path: |
            ${{ steps.download.outputs.req }}.chunk-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload small transfer artifact
        if: "!startsWith(steps.download.outputs.req, 'part-')"
        uses: actions/upload-artifact@v4
        with:
          name: full7-recovery-${{ steps.download.outputs.req }}
          path: |
            ${{ steps.download.outputs.req }}
            FULL7_TRANSFER_RECEIPT.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
