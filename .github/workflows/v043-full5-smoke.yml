name: SPEC v1.1 strongest-market production smoke

on:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile SPEC v1.1 strongest-market production stack
        run: |
          python -m py_compile app_v040.py spec11_native_engine.py spec11_strongest_market_engine.py spec11_strongest_market_patch.py research/test_spec11_native_engine.py research/test_spec11_strongest_market.py app.py
      - name: Run strongest-market and cold-start smoke
        run: python -m research.test_spec11_strongest_market
      - name: Assert production is signal comparison without decision engine
        run: |
          python - <<'PY'
          import app
          import app_v040 as legacy
          from spec11_strongest_market_engine import ENGINE_NAME, ENGINE_VERSION

          assert app.app.version == ENGINE_VERSION
          assert 'SPEC-v1.1-Auswertung der FootyStats-Daten' in legacy.INDEX_HTML
          assert 'stärkster Markt' in legacy.INDEX_HTML
          assert 'kein V0.4.3' in legacy.INDEX_HTML
          assert 'kein V0.4.2' in legacy.INDEX_HTML
          assert 'kein Fallback' in legacy.INDEX_HTML
          assert 'Probability Core: V0.4.3' not in legacy.INDEX_HTML
          assert 'Entscheidung</div>' not in legacy.INDEX_HTML
          health = next(route.endpoint for route in app.app.router.routes if getattr(route,'path',None)=='/api/health')()
          assert health['engine'] == ENGINE_NAME
          assert health['architecture'] == 'SPEC_V1_1_SIGNAL_COMPARISON'
          assert health['analysis_type'] == 'STRONGEST_MARKET'
          assert health['decision_engine'] == 'NONE'
          assert health['probability_core'] == 'NONE'
          assert health['v043_used'] is False
          assert health['v042_used'] is False
          assert health['fallback'] == 'NONE'
          assert health['odds_used'] is False
          assert health['cold_start_supported'] is True
          assert health['low_sample_supported'] is True
          paths = {getattr(route,'path',None) for route in app.app.router.routes}
          assert '/api/predict' not in paths
          assert '/api/predict-files' not in paths
          assert '/api/predict-bundle' in paths
          print('SPEC v1.1 strongest-market production smoke OK', health)
          PY
