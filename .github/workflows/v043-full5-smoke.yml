name: SPEC v1.1 full-signal strongest-market production smoke

on:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile SPEC v1.1 full-signal production stack
        run: |
          python -m py_compile app_v040.py spec11_native_engine.py spec11_signal_expansion.py spec11_strongest_market_engine.py spec11_strongest_market_patch.py spec11_full_signal_patch.py spec11_target_player_scope_patch.py spec11_ui_cleanup_patch.py spec11_draw_parity_patch.py research/test_spec11_native_engine.py research/test_spec11_strongest_market.py research/test_spec11_ranking_consistency.py research/test_spec11_draw_parity.py app.py
      - name: Run strongest-market and cold-start smoke
        run: python -m research.test_spec11_strongest_market
      - name: Run ranking-consistency regression
        run: python -m research.test_spec11_ranking_consistency
      - name: Run draw-parity regression
        run: python -m research.test_spec11_draw_parity
      - name: Assert production is full-signal comparison without decision engine
        run: |
          python - <<'PY'
          import app
          import app_v040 as legacy
          import spec11_strongest_market_engine as engine
          from spec11_ui_cleanup_patch import _clean_h2h_wording

          assert app.app.version == '1.1.5-draw-parity'
          assert engine.ENGINE_VERSION == '1.1.5-draw-parity'
          assert 'SPEC v1.1 · Engine v1.1.5' in legacy.INDEX_HTML
          assert 'Build 1.1.5-draw-parity' in legacy.INDEX_HTML
          assert 'SPEC v1.1 / Engine v1.1.5 auswerten' in legacy.INDEX_HTML
          assert 'vollständige sinnvolle SPEC-v1.1-Signalbreite' in legacy.INDEX_HTML
          assert 'kein V0.4.x' in legacy.INDEX_HTML
          assert 'kein Fallback' in legacy.INDEX_HTML

          sample = {
              'ok': True,
              'markets': [{
                  'signals': [{
                      'source': 'H2H',
                      'domain': 'H2H_RESULT',
                      'reason': 'H2H ist ausschließlich sekundäre Evidenz und kann allein kein SPIELEN erzeugen.'
                  }]
              }]
          }
          cleaned = _clean_h2h_wording(sample)
          reason = cleaned['markets'][0]['signals'][0]['reason']
          assert 'SPIELEN' not in reason
          assert 'keine klare Markt-Empfehlung' in reason

          health = next(route.endpoint for route in app.app.router.routes if getattr(route,'path',None)=='/api/health')()
          assert health['architecture'] == 'SPEC_V1_1_FULL_SIGNAL_COMPARISON'
          assert health['analysis_type'] == 'STRONGEST_MARKET'
          assert health['decision_engine'] == 'NONE'
          assert health['probability_core'] == 'NONE'
          assert health['v043_used'] is False
          assert health['v042_used'] is False
          assert health['fallback'] == 'NONE'
          assert health['odds_used'] is False
          assert health['cold_start_supported'] is True
          assert health['low_sample_supported'] is True
          assert health['player_analysis_scope'] == 'TARGET_HOME_AWAY_ONLY'
          assert health['league_player_pages_role'] == 'RETRIEVAL_COMPLETENESS_AND_AUDIT_ONLY'
          assert health['other_league_players_market_evidence'] is False
          assert health['ranking_consistency_guard'] is True
          assert health['clear_requires_positive_total_evidence'] is True
          assert health['draw_parity_guard'] is True
          assert health['generic_strength_parity_is_draw_evidence'] is False
          paths = {getattr(route,'path',None) for route in app.app.router.routes}
          assert '/api/predict' not in paths
          assert '/api/predict-files' not in paths
          assert '/api/predict-bundle' in paths
          print('SPEC v1.1 / Engine v1.1.5 draw-parity smoke OK', health)
          PY
