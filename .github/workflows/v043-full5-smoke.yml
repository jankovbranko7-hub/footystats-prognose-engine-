name: FULL-5 NEXT production smoke

on:
  push:
    branches:
      - feat/v0.4.3-full5
      - feat/v0.4.3-pairing-ui-final
      - feat/v0.4.3-observe-fazit
      - release/full5-next-1.0
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Syntax, 18 tests, entrypoint and locked production invariants
        run: |
          python -m py_compile app_v040.py v041_engine.py v042_engine.py v043_engine.py v043_release.py v043_pairing_ui.py v043_observe_fazit_ui.py full5_next_engine.py full5_next_release.py app.py test_full5_next.py
          python -m unittest -v test_full5_next.py
          python - <<'PY'
          import math
          import app
          import app_v040 as legacy
          import v043_engine as e
          import v043_release as r
          import full5_next_engine as n
          assert app.app.version == 'FULL-5-NEXT-1.0.0'
          assert e.FEATURE_COUNT == 40
          assert len(e.FULL5_FEATURES) == len(e.FULL5_MEAN) == len(e.FULL5_SCALE) == len(e.FULL5_COEF) == 40
          assert all(math.isfinite(x) for x in e.FULL5_MEAN + e.FULL5_SCALE + e.FULL5_COEF)
          assert all(x > 0 for x in e.FULL5_SCALE)
          assert r.FULL5_ALPHA == 3.0
          assert e.FULL5_ALPHA == 3.0
          row={name:mean for name,mean in zip(e.FULL5_FEATURES,e.FULL5_MEAN)}
          lam=e._predict_lambda(row)
          assert 0.05 <= lam <= 3.95
          assert 'Spielpaarung' in legacy.INDEX_HTML
          assert "const homeName=matchInfo.home_name" in legacy.INDEX_HTML
          assert "const awayName=matchInfo.away_name" in legacy.INDEX_HTML
          assert 'Match-ID:' in legacy.INDEX_HTML
          assert 'FULL-5-Status' in legacy.INDEX_HTML
          assert 'FULL-5: AKTIV ✅' in legacy.INDEX_HTML
          assert 'FULL-5: FALLBACK AUF V0.4.2 ⚠️' in legacy.INDEX_HTML
          assert 'Warum BEOBACHTEN?' in legacy.INDEX_HTML
          assert 'decision_reasons' in legacy.INDEX_HTML
          assert 'confirming_blocks' in legacy.INDEX_HTML
          assert 'counter_blocks' in legacy.INDEX_HTML
          assert 'FootyStats FULL-5 NEXT' in legacy.INDEX_HTML
          assert 'FULL-5 NEXT – Finale Entscheidung' in legacy.INDEX_HTML
          assert 'Gewählter Markt' in legacy.INDEX_HTML
          assert 'Signal Agreement / Conflict' in legacy.INDEX_HTML
          assert 'Gegenargumente / Konflikte' in legacy.INDEX_HTML
          health = next(route.endpoint for route in app.app.router.routes if getattr(route,'path',None)=='/api/health')()
          assert health['version']=='FULL-5-NEXT-1.0.0'
          assert health['engine']=='full5-next-evidence-gated-six-market'
          assert health['probability_core']=='V0.4.3 FULL-5'
          assert health['rho']==-0.25
          assert health['full5_features']==40
          assert health['alpha']==3.0
          assert health['production'] is True
          assert health['elite_lambda_correction'] is False
          assert health['new_feature_blocks']==0
          assert health['file_6'] is False and health['file_7'] is False
          assert health['no_bet'] is True
          assert health['oos']['hits']==23 and health['oos']['plays']==33
          assert n.PLAY_PROBABILITY==0.60 and n.MIN_SAMPLE_QUALITY==0.40
          print('FULL-5 NEXT production smoke OK', health, 'lambda@mean=', lam)
          PY
