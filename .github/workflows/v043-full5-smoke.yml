name: Production smoke legacy + FULL-7 Final

on:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      FULL7_PHASE7_MANIFEST_SHA256: d003e9b9ae0f93667ed3d7a459f38a704eaa49dcb7f0e7d5612784bd357cbce7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Compile current production stack
        run: |
          python -m py_compile \
            app.py app_v040.py spec11_joint_core_patch.py \
            full7_foundation.py full7_phase7_upload_api.py \
            full7_phase7_features.py full7_phase7_runtime.py full7_phase7_decision.py

      - name: Run FULL-7 regression suite
        run: python -m unittest discover -s tests -p "test_full7_*.py" -v

      - name: Assert legacy compatibility and FULL-7 final production wiring
        run: |
          python - <<'PY'
          import app

          paths = {
              getattr(route, "path", None): route
              for route in app.app.router.routes
              if getattr(route, "path", None)
          }
          required = {
              "/api/health",
              "/api/predict-bundle",
              "/api/full7/health",
              "/api/full7/validate",
              "/api/full7/engine-health",
              "/api/full7/predict",
          }
          assert required.issubset(paths), required - set(paths)

          legacy_health = paths["/api/health"].endpoint()
          assert legacy_health.get("ok") is True

          engine_health = paths["/api/full7/engine-health"].endpoint()
          assert engine_health["ok"] is True, engine_health
          assert engine_health["runtime_ready"] is True
          assert engine_health["engine"] == "FOOTYSTATS_FULL7_FINAL"
          assert engine_health["engine_version"] == "FULL7_FINAL_RC_1.0.0"
          assert engine_health["expected_files"] == 7
          assert engine_health["probability_mode_no_odds"] is True
          assert engine_health["spielen_allowed_families"] == ["HOME", "AWAY", "BTTS_YES"]
          assert engine_health["draw_status"] == "AUSLASSEN_ONLY"
          assert engine_health["btts_no_status"] == "BEOBACHTEN_ONLY"
          assert engine_health["o25_status"] == "HOLD"
          assert engine_health["legacy_v3_1_override_active"] is False

          predict_route = paths["/api/full7/predict"]
          assert predict_route.endpoint.__module__ == "full7_phase7_upload_api"

          print("Legacy compatibility + FULL7_FINAL_RC_1.0.0 production smoke OK")
          PY
