name: Research Context Smoke

on:
  push:
    branches:
      - research/context-adaptive-current-layer
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile research modules
        run: python -m py_compile research/current_match_context.py research/current_context_runtime.py research/api_football_context_adapter.py research/research_context_engine.py app_research_context.py
      - name: Run research context smoke
        run: python research/test_research_context.py
      - name: Assert production entry point untouched
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text()
          assert 'app_research_context' not in app
          assert 'research.' not in app
          assert 'v043_observe_fazit_ui' in app
          print('production entry point remains V0.4.3-only')
          PY
