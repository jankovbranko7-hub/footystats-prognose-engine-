name: Research Context Smoke

on:
  push:
    branches:
      - research/context-adaptive-current-layer
      - feat/footystats-official-analysis-spec-v1-1
      - feat/async-shortcut-fix6
      - feat/shortcut-fast-server-side
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile context, official spec and release modules
        run: python -m py_compile app.py research/current_match_context.py research/current_context_runtime.py research/api_football_context_adapter.py research/context_interpreter.py research/learned_reliability_policy.py research/footystats_match_logic.py research/footystats_official_spec.py research/context_snapshot_archive.py research/context_snapshot_store.py research/research_context_engine.py research/test_research_context.py research/test_footystats_match_logic.py research/test_official_spec_runtime.py research/test_release_candidate.py research/test_shortcut_fast_runtime.py app_research_context.py v050_context_release.py v050_footystats_unified_logic.py v050_official_spec_patch.py v050_shortcut_async_patch.py v050_shortcut_fast_patch.py
      - name: Validate machine-readable contracts
        run: |
          python - <<'PY'
          import json
          for path in ('footystats_field_registry.json','footystats_shortcut_api_schema.json'):
              with open(path, encoding='utf-8') as fh:
                  data=json.load(fh)
              assert data.get('schema_version') == '1.1', path
          print('Official Analysis Spec JSON contracts valid')
          PY
      - name: Run context-policy smoke
        run: python -m research.test_research_context
      - name: Run qualitative FootyStats context logic
        run: python -m research.test_footystats_match_logic
      - name: Run FootyStats Official Analysis Spec runtime smoke
        run: python -m research.test_official_spec_runtime
      - name: Run FAST server-side shortcut collection smoke
        run: python -m research.test_shortcut_fast_runtime
      - name: Run real V0.5.0 unified release-candidate smoke
        run: python -m research.test_release_candidate
      - name: Assert exact V0.5.0 production composition
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('app.py').read_text()
          assert 'from v050_footystats_unified_logic import apply_patch as apply_v050_patch' in source
          assert 'from v050_official_spec_patch import apply_patch as apply_official_spec_patch' in source
          assert 'from v050_shortcut_async_patch import apply_patch as apply_shortcut_async_patch' in source
          assert 'from v050_shortcut_fast_patch import apply_patch as apply_shortcut_fast_patch' in source
          assert 'app = apply_shortcut_fast_patch(' in source
          assert 'apply_shortcut_async_patch(' in source
          assert 'apply_official_spec_patch(legacy, apply_v050_patch(legacy))' in source
          assert 'v043_engine.legacy = legacy' in source
          assert 'app_research_context' not in source
          print('app.py composes unified V0.5.0 + Official Spec + async + FAST transport')
          PY
      - name: Assert runtime endpoints and frozen-core contract
        run: |
          python - <<'PY'
          import app as production
          routes={getattr(r,'path',None):r for r in production.app.router.routes}
          for path in (
              '/api/predict-bundle','/api/archive-bundle','/api/health',
              '/api/footystats-official-spec','/api/shortcut-api-schema',
              '/api/predict-shortcut-v1-1','/api/predict-shortcut-v1-1-async',
              '/api/predict-shortcut-v1-1-job/{job_id}',
              '/api/predict-shortcut-fast','/api/predict-shortcut-fast-job/{job_id}'
          ):
              assert path in routes, path
          health=routes['/api/health'].endpoint()
          assert health['ok'] is True
          assert health['version'] == '0.5.0'
          assert health['probability_core'] == 'V0.4.3 FULL-5'
          assert health['full5_alpha'] == 3.0
          assert health['dixon_coles_rho'] == -0.25
          assert health['iphone_files'] == 5
          assert health['footystats_official_analysis_spec'] == '1.1'
          assert health['official_spec_runtime'] is True
          assert health['strict_prematch_validator'] is True
          assert health['official_rules_decision_influence'] is False
          assert health['official_rules_probability_influence'] is False
          assert health['shortcut_async_transport'] is True
          assert health['shortcut_fast_server_collection'] is True
          assert health['shortcut_fast_submit_endpoint'] == '/api/predict-shortcut-fast'
          assert health['shortcut_fast_status_endpoint'] == '/api/predict-shortcut-fast-job/{job_id}'
          assert health['shortcut_fast_virtual_files'] == 5
          assert health['shortcut_fast_api_key_persisted'] is False
          print('runtime endpoints, FAST transport and frozen-core contract passed')
          PY
