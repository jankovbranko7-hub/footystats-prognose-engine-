name: Verify Render V0.5.0 CONTEXT-AWARE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-render:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed version, frozen core, Official Spec and FAST Shortcut
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://footystats-prognose-engine.onrender.com/api/health"
          PAGE_URL="https://footystats-prognose-engine.onrender.com/"
          SPEC_URL="https://footystats-prognose-engine.onrender.com/api/footystats-official-spec"
          SHORTCUT_URL="https://footystats-prognose-engine.onrender.com/api/shortcut-api-schema"
          OPENAPI_URL="https://footystats-prognose-engine.onrender.com/openapi.json"
          for i in $(seq 1 36); do
            BODY="$(curl -fsS --max-time 20 "$HEALTH_URL" 2>/dev/null || true)"
            PAGE="$(curl -fsS --max-time 20 "$PAGE_URL" 2>/dev/null || true)"
            SPEC="$(curl -fsS --max-time 20 "$SPEC_URL" 2>/dev/null || true)"
            SHORTCUT="$(curl -fsS --max-time 20 "$SHORTCUT_URL" 2>/dev/null || true)"
            OPENAPI="$(curl -fsS --max-time 20 "$OPENAPI_URL" 2>/dev/null || true)"
            echo "attempt=$i health=$BODY"
            if echo "$BODY" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("version")=="0.5.0" and d.get("production") is True and d.get("probability_core")=="V0.4.3 FULL-5" and d.get("full5_alpha")==3.0 and d.get("dixon_coles_rho")==-0.25 and d.get("iphone_files")==5 and d.get("manual_performance_gates")=="NONE" and d.get("footystats_official_analysis_spec")=="1.1" and d.get("official_spec_runtime") is True and d.get("strict_prematch_validator") is True and d.get("official_rules_decision_influence") is False and d.get("official_rules_probability_influence") is False and d.get("shortcut_async_transport") is True and d.get("shortcut_fast_server_collection") is True and d.get("shortcut_fast_submit_endpoint")=="/api/predict-shortcut-fast" and d.get("shortcut_fast_status_endpoint")=="/api/predict-shortcut-fast-job/{job_id}" and d.get("shortcut_fast_virtual_files")==5 and d.get("shortcut_fast_api_key_persisted") is False' \
              && echo "$SPEC" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("schema_version")=="1.1" and d.get("name")=="FOOTYSTATS_OFFICIAL_ANALYSIS_SPEC_FIELD_REGISTRY"' \
              && echo "$SHORTCUT" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("schema_version")=="1.1" and d.get("schema_revision")=="1.1.3" and d.get("primary_mode")=="FAST_SERVER_SIDE_COLLECTION" and d.get("fast_submit",{}).get("endpoint")=="/api/predict-shortcut-fast" and d.get("server_collection",{}).get("virtual_file_count")==5' \
              && echo "$OPENAPI" | python -c 'import json,sys; p=json.load(sys.stdin).get("paths",{}); assert "/api/predict-shortcut-v1-1" in p and "/api/predict-shortcut-v1-1-async" in p and "/api/predict-shortcut-fast" in p and "/api/predict-shortcut-fast-job/{job_id}" in p' \
              && grep -Fq 'FootyStats V0.5.0 CONTEXT-AWARE' <<<"$PAGE" \
              && grep -Fq 'FootyStats Official Analysis Spec' <<<"$PAGE" \
              && grep -Fq 'FootyStats Gesamtlogik' <<<"$PAGE"; then
              echo "Render V0.5.0 + Official Spec 1.1 + FAST server-side Shortcut verified; frozen core unchanged"
              exit 0
            fi
            sleep 10
          done
          echo "Render did not expose the expected FAST server-side Shortcut deployment"
          exit 1
