name: Verify Render legacy + FULL-7 Final

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-render:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed legacy and FULL-7 Final runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://footystats-prognose-engine.onrender.com"
          HEALTH_URL="$BASE/api/health"
          ENGINE_URL="$BASE/api/full7/engine-health"
          OPENAPI_URL="$BASE/openapi.json"
          PAGE_URL="$BASE/"

          for i in $(seq 1 30); do
            HEALTH="$(curl -fsS --max-time 20 "$HEALTH_URL" 2>/dev/null || true)"
            ENGINE="$(curl -fsS --max-time 20 "$ENGINE_URL" 2>/dev/null || true)"
            OPENAPI="$(curl -fsS --max-time 20 "$OPENAPI_URL" 2>/dev/null || true)"
            PAGE="$(curl -fsS --max-time 20 "$PAGE_URL" 2>/dev/null || true)"

            echo "attempt=$i"
            if echo "$HEALTH" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True' \
              && echo "$ENGINE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("runtime_ready") is True and d.get("engine")=="FOOTYSTATS_FULL7_FINAL" and d.get("engine_version")=="FULL7_FINAL_RC_1.0.0" and d.get("expected_files")==7 and d.get("probability_mode_no_odds") is True and d.get("spielen_allowed_families")==["HOME","AWAY","BTTS_YES"] and d.get("draw_status")=="AUSLASSEN_ONLY" and d.get("btts_no_status")=="BEOBACHTEN_ONLY" and d.get("o25_status")=="HOLD" and d.get("legacy_v3_1_override_active") is False' \
              && echo "$OPENAPI" | python -c 'import json,sys; p=json.load(sys.stdin).get("paths",{}); required={"/api/predict-bundle","/api/full7/health","/api/full7/validate","/api/full7/engine-health","/api/full7/predict"}; assert required.issubset(p)' \
              && grep -Fq 'FULL7_FINAL_RC_1.0.0' <<<"$PAGE" \
              && grep -Fq 'SPIELEN: HOME | AWAY | BTTS YES' <<<"$PAGE" \
              && grep -Fq 'O25/U25: HOLD' <<<"$PAGE"; then
              echo "Render legacy compatibility + FULL7_FINAL_RC_1.0.0 verified"
              exit 0
            fi
            sleep 10
          done

          echo "Render did not expose the expected FULL7_FINAL_RC_1.0.0 deployment"
          exit 1
