name: Verify Render V0.4.3 FULL-5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-render:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://footystats-prognose-engine.onrender.com/api/health"
          for i in $(seq 1 36); do
            BODY="$(curl -fsS --max-time 20 "$URL" 2>/dev/null || true)"
            echo "attempt=$i body=$BODY"
            if echo "$BODY" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("version")=="0.4.3" and d.get("engine")=="five-source-full5-regularized-dixon-coles" and d.get("rho")==-0.25 and d.get("full5_features")==40 and d.get("alpha")==3.0 and d.get("production") is True and d.get("candidate") is False and d.get("elite_lambda_correction") is False'; then
              echo "Render production is V0.4.3 FULL-5"
              exit 0
            fi
            sleep 10
          done
          echo "Render did not report V0.4.3 FULL-5"
          exit 1
