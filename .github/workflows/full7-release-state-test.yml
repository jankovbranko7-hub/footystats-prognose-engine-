name: FULL-7 Release State Test

on:
  push:
    branches:
      - fix/full7-release-status

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_full7_release_state -v
