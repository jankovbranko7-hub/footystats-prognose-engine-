name: Forebet DOM probe

on:
  push:
    branches:
      - ops/live-check

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render deploy
        run: sleep 80
      - name: Read real Forebet DOM snippets
        run: |
          code=$(curl -sS --max-time 420 -o debug.json -w '%{http_code}' \
            'https://footystats-forebet-auto-v4-test.onrender.com/api/forebet-auto/debug-pages?date=2026-09-02&force=true')
          cat debug.json
          echo
          echo "HTTP_STATUS:$code"
          test "$code" = "200"
