name: Live Forebet Browser diagnostic

on:
  push:
    branches:
      - ops/live-check

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render auto-deploy
        run: sleep 80
      - name: Fetch safe Forebet browser diagnostics
        run: |
          code=$(curl -sS --max-time 420 -o debug.json -w '%{http_code}' \
            'https://footystats-forebet-auto-v4-test.onrender.com/api/forebet-auto/debug-pages?date=2026-09-02&force=true')
          cat debug.json
          echo
          echo "HTTP_STATUS:$code"
