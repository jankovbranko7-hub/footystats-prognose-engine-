name: Forebet AUTO V5 Bay debug

on:
  push:
    branches:
      - ops/live-check

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify V5 health
        run: |
          body=$(curl -sS --max-time 120 'https://footystats-forebet-auto-v4-test.onrender.com/api/forebet-auto/health')
          echo "$body"
          echo "$body" | grep -q 'forebet-auto-v5-compact-dom'
      - name: Bay live debug
        run: |
          code=$(curl -sS --max-time 420 -o debug.json -w '%{http_code}' \
            'https://footystats-forebet-auto-v4-test.onrender.com/api/forebet-auto/debug?home=Bay%20Olympic&away=Birkenhead%20United&date=2026-09-02&force=true')
          cat debug.json; echo; echo "HTTP_STATUS:$code"
          test "$code" = "200"
