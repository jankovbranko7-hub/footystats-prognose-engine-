name: FootyStats Forebet AUTO V4 shortcut validation

on:
  push:
    branches:
      - ops/live-check

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/forebet-auto-v4

      - name: Build AUTO V4 test shortcut
        run: python build_shortcut_auto_v4.py

      - name: Validate shortcut structure
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          path=Path('FootyStats_Forebet_AUTO_V4_TEST_unsigned.shortcut')
          data=path.read_bytes()
          assert data.startswith(b'bplist00')
          wf=plistlib.loads(data)
          actions=wf['WFWorkflowActions']
          assert len(actions)==98, len(actions)
          assert wf['WFWorkflowName']=='FootyStats + Forebet AUTO V4 TEST'
          text=str(wf)
          assert 'https://footystats-forebet-auto-v4-test.onrender.com/api/forebet-auto?match_id=' in text
          assert '&date=' in text
          assert 'Forebet: 1;X;2' not in text
          assert '_ForebetDaten.json' in text
          print('SHORTCUT_VALIDATION_PASS')
          print('actions=98')
          print('manual_forebet_input=false')
          print('sixth_file=ForebetDaten.json')
          PY

      - name: Upload unsigned test shortcut
        uses: actions/upload-artifact@v4
        with:
          name: FootyStats-Forebet-AUTO-V4-TEST-unsigned
          path: FootyStats_Forebet_AUTO_V4_TEST_unsigned.shortcut
          if-no-files-found: error
