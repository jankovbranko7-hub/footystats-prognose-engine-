name: FULL-7 Contract OOS20 Batch B Freeze

on:
  push:
    branches:
      - feat/full7-contract-implementation
    paths:
      - 'research/oos20_input_batchB/**'
      - 'research/run_oos20_batch_b_raw.py'
      - '.github/workflows/full7-contract-oos20-batch-b.yml'
      - 'full7_foundation.py'
      - 'full7_gold_features.py'
      - 'full7_contract_*.py'
      - 'models/full7_contract_*'
      - 'models/full7_evidence_reference.json.gz'
  workflow_dispatch:

jobs:
  freeze-oos20-batch-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Freeze strict FULL-7 Batch B
        env:
          PYTHONPATH: .
        run: python research/run_oos20_batch_b_raw.py
      - name: Upload frozen Batch B predictions
        uses: actions/upload-artifact@v4
        with:
          name: full7-oos20-batch-b-frozen-predictions
          path: research/oos20_output_batchB/*.json
          if-no-files-found: error
          retention-days: 7
