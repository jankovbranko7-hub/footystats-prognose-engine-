name: V1 Full V043 Invariant Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feat/v1-full-specialists, fix/v1-production-audit ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app.py app_v040.py v041_engine.py v042_engine.py v043_engine.py v043_release.py v043_pairing_ui.py v043_observe_fazit_ui.py v1_engine.py v1_full_engine.py v1_release.py test_v1_engine.py test_v1_full_engine.py
      - name: V1 invariant and full-specialist tests
        run: python -m unittest -v test_v1_engine.py test_v1_full_engine.py
      - name: Prove V0.4.3 core files were not edited
        run: |
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD -- v043_engine.py v043_release.py v042_engine.py v041_engine.py app_v040.py)"
      - name: Prove visible V1 rationale, pairing and market breadth remain
        run: |
          python - <<'PY'
          import app
          import app_v040 as legacy
          import v1_full_engine
          html = legacy.INDEX_HTML
          assert 'Spielpaarung' in html
          assert 'Warum BEOBACHTEN?' in html
          assert 'V1 Multi-Market & Specialists' in html
          assert 'Alle sechs Märkte' in html
          assert 'Core-Topmarkt' in html
          route = next(r for r in legacy.app.router.routes if getattr(r, 'path', None) == '/api/health')
          health = route.endpoint()
          assert health['alpha'] == 3.0
          assert health['rho'] == -0.25
          assert health['full5_features'] == 40
          assert health['probabilities_modified_by_v1'] is False
          assert health['new_lambda_core'] is False
          assert len(health['all_six_markets']) == 6
          assert all(health['specialists'].values())
          form_rows = v1_full_engine._form_records({'teams': [{'data': [{'id': 1}]}]})
          assert len(form_rows) == 1
          chosen = v1_full_engine._select_robust_market([
              {'key': 'home_win', 'decision': 'SPIELEN', 'probability_pct': 58.0, 'family_strength_pct': 37.0},
              {'key': 'btts_yes', 'decision': 'SPIELEN', 'probability_pct': 68.0, 'family_strength_pct': 36.0},
          ])
          assert chosen['key'] == 'home_win'
          print('V1 full invariants OK')
          PY
