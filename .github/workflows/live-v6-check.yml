name: Live Forebet elite fusion check

on:
  push:
    branches:
      - feat/forebet-auto-v4
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Deterministic elite fusion unit test with proven Luzern Forebet data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from elite_fusion import attach_forebet_elite

          footystats = {
              'ok': True,
              'model_version': '0.4.0',
              'decision': 'BEOBACHTEN',
              'probabilities': {
                  'home_win': 0.4931372391,
                  'draw': 0.2209022904,
                  'away_win': 0.2859604705,
                  'btts_yes': 0.6504236887,
                  'btts_no': 0.3495763113,
                  'over_2_5': 0.6526801155,
                  'under_2_5': 0.3473198845,
              },
              'markets': [],
              'strongest_market': {'key': 'over_2_5', 'probability_pct': 65.3},
              'expected_goals': {'home': 1.9306808652, 'away': 1.4303477347, 'total': 3.3610285999},
              'samples': {'security': 'NIEDRIG'},
              'diagnostics': {
                  'data_quality': 'HOCH',
                  'sample_security': 'NIEDRIG',
                  'result_vs_underlying': 'TEILWEISE KONSISTENT',
                  'robustness_status': 'BESTANDEN',
                  'single_point_of_failure': False,
                  'elite_protocol': {'gates': {'multi_block_confirmation': 'BESTANDEN', 'coherence': {'passed': True}}},
              },
              'method': {},
              'notes': [],
          }

          # Proven iPhone reference snapshot: Luzern - Vaduz, Match-ID 8554458.
          forebet = {
              'match_id': 8554458,
              'probabilities': {
                  'home_win': 0.53,
                  'draw': 0.26,
                  'away_win': 0.21,
                  'btts_yes': 0.81,
                  'btts_no': 0.19,
                  'over_2_5': 0.68,
                  'under_2_5': 0.32,
              },
              'predicted_score': '3-2',
              'average_goals': 3.38,
          }

          result = attach_forebet_elite(footystats, forebet)
          assert result['model_version'] == '0.6.1-elite-fusion'
          assert result['ensemble']['active'] is True
          assert result['ensemble']['backtested_weights'] is False
          assert result['method']['odds_used'] is False

          weights = result['ensemble']['weights']
          for family in ('1x2', 'btts', 'ou'):
              assert 0.50 <= weights[family]['footystats'] <= 0.70
              assert 0.30 <= weights[family]['forebet'] <= 0.50
              assert abs(weights[family]['footystats'] + weights[family]['forebet'] - 1.0) < 1e-6

          fused = result['probabilities']
          for key, value in fused.items():
              if key in ('home_win','draw','away_win','btts_yes','btts_no','over_2_5','under_2_5'):
                  assert 0.0 <= float(value) <= 1.0
          assert abs(fused['home_win'] + fused['draw'] + fused['away_win'] - 1.0) < 1e-9
          assert abs(fused['btts_yes'] + fused['btts_no'] - 1.0) < 1e-9
          assert abs(fused['over_2_5'] + fused['under_2_5'] - 1.0) < 1e-9
          print('ELITE_FUSION_LUZERN_REFERENCE_PASS')
          PY

      - name: Wait for Render deployment
        run: sleep 75

      - name: Check known-good Forebet adapter health
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://footystats-forebet-auto-v4-test.onrender.com'
          for i in {1..8}; do
            code=$(curl -L -sS --max-time 90 -o /tmp/health.json -w '%{http_code}' "$BASE/api/forebet-auto/health" || true)
            cat /tmp/health.json || true
            if [ "$code" = "200" ] && grep -q '"final_adapter":true' /tmp/health.json && grep -q '"dom_textcontent":true' /tmp/health.json; then
              exit 0
            fi
            sleep 20
          done
          echo 'Known-good Forebet adapter health check failed'
          exit 1

      - name: Check elite fusion live health
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://footystats-forebet-auto-v4-test.onrender.com'
          code=$(curl -L -sS --max-time 90 -o /tmp/elite.json -w '%{http_code}' "$BASE/api/elite-fusion/health" || true)
          cat /tmp/elite.json || true
          test "$code" = "200"
          grep -q '"active":true' /tmp/elite.json
          grep -q '"version":"0.6.1-elite-fusion"' /tmp/elite.json
          grep -q '"forebet_acquisition":"known-good-3a1d12f"' /tmp/elite.json
          grep -q '"equal_weight_50_50":false' /tmp/elite.json
          grep -q '"odds_used":false' /tmp/elite.json

      - name: Diagnostic - external Luzern Vaduz Forebet snapshot (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://footystats-forebet-auto-v4-test.onrender.com'
          URL="$BASE/api/forebet-auto?match_id=8554458&home=Luzern&away=Vaduz&date=2026-09-02&force=false"
          start=$(date +%s)
          code=$(curl -L -sS --max-time 30 -o /tmp/result.json -w '%{http_code}' "$URL" || true)
          elapsed=$(( $(date +%s) - start ))
          echo "HTTP=$code elapsed_seconds=$elapsed"
          cat /tmp/result.json || true
          if [ "$code" != "200" ]; then
            echo 'External Forebet acquisition is currently slow/unavailable; diagnostic only, not an Elite release blocker.'
            exit 1
          fi
          python - <<'PY'
          import json, re
          d=json.load(open('/tmp/result.json'))
          assert d['match_id'] == 8554458
          for key in ('home_win','draw','away_win','btts_yes','over_2_5','predicted_score','average_goals'):
              assert key in d and d[key] not in (None, '')
          assert 95 <= float(d['home_win']) + float(d['draw']) + float(d['away_win']) <= 105
          assert 0 <= float(d['btts_yes']) <= 100
          assert 0 <= float(d['over_2_5']) <= 100
          assert re.fullmatch(r'\d{1,2}[-:]\d{1,2}', str(d['predicted_score']))
          assert 0 <= float(d['average_goals']) <= 10
          print('LUZERN_VADUZ_FOREBET_DIAGNOSTIC_PASS')
          PY
