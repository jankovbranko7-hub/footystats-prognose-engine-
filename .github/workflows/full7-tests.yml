name: FULL-7 Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feat/full7-bronze-silver-gold, feat/full7-v2-seven-market-heads, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run FULL-7 unit tests
        run: python -m unittest discover -s tests -p "test_full7_*.py" -v
