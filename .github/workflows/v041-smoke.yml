name: V0.4.1 smoke

on:
  push:
    branches:
      - release/v0.4.1-data-backtest
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py app_v040.py v041_engine.py
      - name: Import app
        run: |
          python - <<'PY'
          import app
          assert app.app.version == '0.4.1', app.app.version
          health_routes = [r for r in app.app.router.routes if getattr(r, 'path', None) == '/api/health']
          assert len(health_routes) == 1, len(health_routes)
          print('V0.4.1 import smoke passed')
          PY
