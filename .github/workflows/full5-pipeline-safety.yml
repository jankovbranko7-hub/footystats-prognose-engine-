name: FULL5 pipeline safety
on:
  push:
    branches: [build/full5-data-pipeline]
  pull_request:
    paths:
      - 'full5_pipeline/**'
      - '.github/workflows/full5-pipeline-safety.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pydantic==2.9.2
      - run: python -m compileall -q full5_pipeline
      - run: python -m unittest discover -s full5_pipeline/tests -v
